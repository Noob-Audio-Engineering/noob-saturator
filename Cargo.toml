[package]
name = "noob-saturator"
description = "Noob Saturator, a free anti-aliased waveshaper whose editor is the OS web view rendering a Vue + Tailwind SPA over noob-vst-webgui-framework"
readme = "README.md"
version = "0.1.0"
authors = ["Ely Erin Fox"]
edition = "2024"
# 2024 needs 1.85; `let`-chains in the page-facing code need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Noob-Audio-Engineering/noob-saturator"
homepage = "https://github.com/Noob-Audio-Engineering/noob-saturator"
# A plug-in, not a library: nothing here goes to crates.io.
publish = false


# How this plug-in presents itself in the plug-in manager. It lives here so
# each plug-in owns its own description --- the manager has no list of them.
[package.metadata.noob]
kind = "effect"
# The Audio Unit component subtype: four characters, unique to this plug-in
# and **never changed**. macOS identifies a component by type, subtype and
# manufacturer, so a session that loaded this one looks it up by "Sat1"
# and finds nothing if it moves.
au_subtype = "Sat1"
name = "Noob Saturator"
accent = "#e8b04b"
tagline = "An antialiased waveshaper with a latency-matched dry path and a live aliasing readout."
features = [
    "Six curves, each shipped with its own transfer function and antiderivative",
    "Antiderivative antialiasing: -85 dB worst case at the expected drive, and the end of the drive control measured and published too",
    "A dry path matched to the wet one within 0.05 dB",
    "The aliasing figure on the face, measured on the signal passing through",
    "Sixteen-times oversampling with a stated, whole-sample latency",
]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "noob-saturator-standalone"
path = "src/bin/standalone.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[features]
default = []
# Build the real VST3 / CLAP plug-in (pulls nih-plug from git and embeds
# `web/dist`, so run `npm run build` in `web/` first). Without it the crate is
# just the DSP plus the standalone dev server.
plugin = ["dep:nih_plug", "dep:noob-vst-webgui-framework-nih", "dep:include_dir"]
hostapp = ["plugin", "nih_plug/standalone"]

[dependencies]
noob-vst-webgui-framework = { git = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework" }
noob-vst-webgui-framework-nih = { git = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework", optional = true }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
include_dir = { version = "0.7", optional = true }
log = "0.4"
env_logger = "0.11"
serde_json = "1"
# The aliasing measurement is a spectrum, so the benchmark needs an FFT. So
# does the panel's live aliasing readout, which is the one display this device
# has that the device it answers does not: it masks the harmonics of the input
# and reports what is left. That transform runs on pre-planned state with
# pre-allocated scratch, so it allocates nothing in the audio thread.
rustfft = "6"

[profile.release]
lto = "thin"
codegen-units = 1

# Host-driven editor resizing needs the patched nih-plug the framework is
# built against; Cargo only honours patches in the root manifest, so every
# plug-in repository carries this line.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { git = "https://github.com/Noob-Audio-Engineering/nih-plug.git", branch = "host-resize" }


[[bin]]
name = "noob-saturator-host"
path = "src/bin/host.rs"
required-features = ["hostapp"]
